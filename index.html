<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Nest</title>
    <style>
      :root {
        --bg: #0f1220;
        --bg-2: #131a2c;
        --panel: #171d2d;
        --panel-alt: #1d2640;
        --panel-soft: #222d46;
        --border: rgba(148, 163, 184, 0.18);
        --text: #e7ebff;
        --muted: #9aa8c7;
        --primary: #7c8cff;
        --primary-strong: #92a0ff;
        --primary-soft: rgba(124, 140, 255, 0.18);
        --accent: #7ee7d8;
        --danger: #ff8d8d;
        --shadow: 0 18px 40px rgba(7, 10, 19, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top left, #1a2340 0%, var(--bg) 32%, #0b1020 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      button, input, textarea, select {
        font: inherit;
      }

      .app {
        max-width: 1500px;
        margin: 0 auto;
        padding: 20px 18px 32px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        background: rgba(19, 26, 44, 0.88);
        border: 1px solid var(--border);
        border-radius: 20px;
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 180px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #7ee7d8);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #0d1120;
        box-shadow: 0 10px 22px rgba(124, 140, 255, 0.45);
      }

      .brand-name {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 280px;
        max-width: 420px;
        flex: 1;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 14px;
      }

      .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 0.96rem;
      }

      .search-box input::placeholder {
        color: var(--muted);
      }

      .ui-btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 10px 14px;
        cursor: pointer;
        border-radius: 12px;
        transition: 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .ui-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(124, 140, 255, 0.5);
        background: rgba(124, 140, 255, 0.08);
      }

      .primary {
        background: linear-gradient(135deg, var(--primary), #8d7cff);
        border-color: transparent;
        color: white;
        box-shadow: 0 10px 22px rgba(124, 140, 255, 0.4);
      }

      .primary:hover {
        background: linear-gradient(135deg, var(--primary-strong), #7c8cff);
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 20px;
        margin-top: 22px;
      }

      .sidebar,
      .editor-shell {
        background: rgba(20, 27, 45, 0.85);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .sidebar {
        padding: 18px 14px;
        overflow: hidden;
      }

      .panel-section {
        margin-bottom: 18px;
      }

      .section-label {
        margin: 0 0 12px 8px;
        color: var(--muted);
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        text-transform: uppercase;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 4px;
      }

      .filter-chip {
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        padding: 7px 12px;
        cursor: pointer;
      }

      .filter-chip.active {
        background: var(--primary-soft);
        border-color: rgba(124, 140, 255, 0.45);
        color: var(--text);
      }

      .note-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .note-item {
        background: rgba(255,255,255,0.025);
        border: 1px solid transparent;
        border-radius: 16px;
        padding: 12px 12px 10px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .note-item:hover {
        border-color: rgba(124, 140, 255, 0.35);
        background: rgba(124, 140, 255, 0.04);
      }

      .note-item.active {
        background: linear-gradient(180deg, rgba(124, 140, 255, 0.12), rgba(124, 140, 255, 0.04));
        border-color: rgba(124, 140, 255, 0.45);
      }

      .note-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }

      .note-title {
        margin: 0;
        font-size: 1rem;
        line-height: 1.3;
        max-width: 210px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pin {
        color: var(--accent);
        font-size: 0.9rem;
      }

      .note-preview {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .note-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 0.72rem;
        color: var(--muted);
      }

      .note-tag-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .tag {
        background: rgba(126, 231, 216, 0.08);
        color: var(--accent);
        border: 1px solid rgba(126, 231, 216, 0.18);
        border-radius: 999px;
        padding: 3px 7px;
        font-size: 0.68rem;
      }

      .editor-shell {
        display: flex;
        flex-direction: column;
        min-height: 760px;
      }

      .editor-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted);
        font-size: 1rem;
        padding: 32px;
      }

      .editor-area {
        display: none;
        height: 100%;
      }

      .editor-area.visible {
        display: block;
      }

      .editor-main {
        padding: 26px 28px 30px;
      }

      .editor-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 18px;
      }

      .title-wrap {
        flex: 1;
      }

      .title-input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: clamp(2rem, 2.5vw, 3rem);
        font-weight: 700;
        line-height: 1.1;
        padding: 0;
        margin-bottom: 10px;
      }

      .title-input::placeholder {
        color: var(--muted);
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        font-size: 0.74rem;
      }

      .tag-editor {
        width: 100%;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        color: var(--text);
        outline: none;
        margin-bottom: 18px;
      }

      .tag-editor::placeholder {
        color: var(--muted);
      }

      .editor-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .content-input {
        width: 100%;
        min-height: 540px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 18px;
        color: var(--text);
        resize: vertical;
        padding: 18px 18px;
        font-size: 1rem;
        line-height: 1.7;
        outline: none;
      }

      .content-input::placeholder {
        color: var(--muted);
      }

      .bottom-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 28px 18px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .stat-pill {
        border-radius: 999px;
        background: rgba(124, 140, 255, 0.08);
        border: 1px solid rgba(124, 140, 255, 0.2);
        color: var(--text);
        padding: 8px 10px;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          padding-bottom: 8px;
        }

        .topbar {
          flex-wrap: wrap;
        }

        .search-box {
          min-width: 100%;
          order: 3;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div class="brand-name">Note Nest</div>
        </div>

        <div class="topbar-actions">
          <div class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="text" placeholder="Search notes" />
          </div>
          <button class="ui-btn" id="themeToggleBtn">Theme</button>
          <button class="ui-btn" id="importBtn">Import</button>
          <button class="ui-btn" id="exportBtn">Export</button>
          <button class="ui-btn primary" id="newNoteBtn">+ New note</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="panel-section">
            <h3 class="section-label">Filters</h3>
            <div class="filter-row">
              <button class="filter-chip active" data-filter="all">All</button>
              <button class="filter-chip" data-filter="pinned">Pinned</button>
              <button class="filter-chip" data-filter="recent">Recent</button>
            </div>
          </div>

          <div class="panel-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
            <h3 class="section-label">Notes</h3>
            <ul class="note-list" id="noteList"></ul>
          </div>
        </aside>

        <section class="editor-shell">
          <div id="editorEmpty" class="editor-empty">Select a note or create a new one to begin writing.</div>

          <div id="editorArea" class="editor-area">
            <div class="editor-main">
              <div class="editor-top">
                <div class="title-wrap">
                  <input id="noteTitle" class="title-input" type="text" placeholder="Untitled note" />
                  <div class="meta-row">
                    <span id="createdAt" class="meta-pill">Created —</span>
                    <span id="updatedAt" class="meta-pill">Updated —</span>
                  </div>
                </div>

                <div class="editor-controls">
                  <button class="ui-btn" id="pinToggleBtn">Pin</button>
                  <button class="ui-btn" id="deleteNoteBtn">Delete</button>
                </div>
              </div>

              <input id="noteTags" class="tag-editor" type="text" placeholder="Add tags separated by commas" />

              <textarea id="noteContent" class="content-input" placeholder="Write something beautiful..."></textarea>
            </div>

            <div class="bottom-bar">
              <div class="stats">
                <span class="stat-pill" id="wordCount">0 words</span>
                <span class="stat-pill" id="tagCount">0 tags</span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <input id="fileInput" type="file" accept="application/json" style="display:none;" />

    <script>
      const STORAGE_KEY = 'note-nest-dark-v1';
      const THEME_KEY = 'note-nest-theme';

      const noteListEl = document.getElementById('noteList');
      const searchInputEl = document.getElementById('searchInput');
      const editorEmptyEl = document.getElementById('editorEmpty');
      const editorAreaEl = document.getElementById('editorArea');
      const noteTitleEl = document.getElementById('noteTitle');
      const noteTagsEl = document.getElementById('noteTags');
      const noteContentEl = document.getElementById('noteContent');
      const createdAtEl = document.getElementById('createdAt');
      const updatedAtEl = document.getElementById('updatedAt');
      const wordCountEl = document.getElementById('wordCount');
      const tagCountEl = document.getElementById('tagCount');
      const fileInputEl = document.getElementById('fileInput');

      let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let activeNoteId = null;
      let currentSearch = '';
      let currentFilter = 'all';

      function initDefaultNotes() {
        notes = [
          {
            id: crypto.randomUUID(),
            title: 'Quarterly goals',
            content: 'Finish the product draft, tighten the onboarding flow, and ship the note sync milestone. Keep the experience comfortable for daily writing sessions.\n\n- Improve startup speed\n- Polish editor spacing\n- Add note export',
            tags: ['work', 'goals'],
            pinned: true,
            createdAt: new Date(Date.now() - 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 900000).toISOString()
          },
          {
            id: crypto.randomUUID(),
            title: 'Weekend trip',
            content: 'Pack a charger, water bottle, and lightweight jacket. Book a coffee spot close to the river and bring a small notebook for sketches.',
            tags: ['personal', 'travel'],
            pinned: false,
            createdAt: new Date(Date.now() - 3 * 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 2 * 3600000).toISOString()
          },
          {
            id: crypto.randomUUID(),
            title: 'Writing sparks',
            content: 'A city built over forgotten train lines. A teenager finding a diary that predicts the weather. A kitchen where every recipe is a memory.',
            tags: ['ideas', 'creative'],
            pinned: false,
            createdAt: new Date(Date.now() - 6 * 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 8 * 3600000).toISOString()
          }
        ];
        activeNoteId = notes[0].id;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      if (!notes.length) initDefaultNotes();

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function formatDate(dateString) {
        return new Date(dateString).toLocaleString([], {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      function countWords(text) {
        return text.trim().split(/\s+/).filter(Boolean).length;
      }

      function getFilteredNotes() {
        let list = [...notes];

        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          list = list.filter(note => {
            const haystack = `${note.title} ${note.content} ${note.tags.join(' ')}`.toLowerCase();
            return haystack.includes(q);
          });
        }

        if (currentFilter === 'pinned') {
          list = list.filter(note => note.pinned);
        } else if (currentFilter === 'recent') {
          list = list.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, 8);
        }

        return list.sort((a, b) => {
          if (a.pinned !== b.pinned) return Number(b.pinned) - Number(a.pinned);
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        });
      }

      function getActiveNote() {
        return notes.find(note => note.id === activeNoteId) || null;
      }

      function renderNotes() {
        const list = getFilteredNotes();
        noteListEl.innerHTML = '';

        if (!list.length) {
          noteListEl.innerHTML = '<li class="note-item"><div class="note-preview">No notes match your filters.</div></li>';
          return;
        }

        list.forEach(note => {
          const li = document.createElement('li');
          li.className = 'note-item' + (note.id === activeNoteId ? ' active' : '');
          li.innerHTML = `
            <div class="note-head">
              <h4 class="note-title">${escapeHtml(note.title || 'Untitled')}</h4>
              ${note.pinned ? '<span class="pin">📌</span>' : ''}
            </div>
            <div class="note-preview">${escapeHtml((note.content || '').replace(/\n/g, ' ').slice(0, 120) || 'No content yet')}</div>
            <div class="note-tag-row">
              ${(note.tags || []).slice(0, 2).map(tag => '<span class="tag">' + escapeHtml(tag) + '</span>').join('') || '<span class="tag">untagged</span>'}
            </div>
            <div class="note-meta">
              <span>${formatDate(note.updatedAt)}</span>
              <span>${note.content ? countWords(note.content) + ' words' : 'empty'}</span>
            </div>
          `;

          li.addEventListener('click', () => {
            activeNoteId = note.id;
            renderNotes();
            renderEditor();
          });

          noteListEl.appendChild(li);
        });
      }

      function renderEditor() {
        const note = getActiveNote();

        if (!note) {
          editorAreaEl.classList.remove('visible');
          editorEmptyEl.style.display = 'flex';
          return;
        }

        editorEmptyEl.style.display = 'none';
        editorAreaEl.classList.add('visible');
        noteTitleEl.value = note.title || '';
        noteTagsEl.value = (note.tags || []).join(', ');
        noteContentEl.value = note.content || '';
        createdAtEl.textContent = 'Created ' + formatDate(note.createdAt);
        updatedAtEl.textContent = 'Updated ' + formatDate(note.updatedAt);
        wordCountEl.textContent = countWords(note.content) + ' words';
        tagCountEl.textContent = (note.tags || []).length + ' tags';
        document.getElementById('pinToggleBtn').textContent = note.pinned ? 'Unpin' : 'Pin';
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function createNote() {
        const now = new Date().toISOString();
        const newNote = {
          id: crypto.randomUUID(),
          title: 'Untitled note',
          content: '',
          tags: [],
          pinned: false,
          createdAt: now,
          updatedAt: now
        };

        notes.unshift(newNote);
        activeNoteId = newNote.id;
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function saveCurrentNote() {
        const note = getActiveNote();
        if (!note) return;

        note.title = noteTitleEl.value.trim() || 'Untitled';
        note.tags = noteTagsEl.value
          .split(',')
          .map(tag => tag.trim())
          .filter(Boolean)
          .filter((tag, index, array) => array.indexOf(tag) === index);
        note.content = noteContentEl.value;
        note.updatedAt = new Date().toISOString();

        saveNotes();
        renderNotes();
        renderEditor();
      }

      function deleteCurrentNote() {
        const note = getActiveNote();
        if (!note) return;

        const confirmed = window.confirm('Delete this note?');
        if (!confirmed) return;

        notes = notes.filter(n => n.id !== note.id);
        activeNoteId = notes[0] ? notes[0].id : null;
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function togglePin() {
        const note = getActiveNote();
        if (!note) return;

        note.pinned = !note.pinned;
        note.updatedAt = new Date().toISOString();
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function setTheme(isDark) {
        document.body.style.background = isDark
          ? 'radial-gradient(circle at top left, #1a2340 0%, #0f1220 34%, #0b1020 100%)'
          : 'radial-gradient(circle at top left, #f3f4f8 0%, #edf2ff 25%, #e9eefc 100%)';

        document.documentElement.style.setProperty('--bg', isDark ? '#0f1220' : '#edf3ff');
        document.documentElement.style.setProperty('--bg-2', isDark ? '#131a2c' : '#f4f7ff');
        document.documentElement.style.setProperty('--panel', isDark ? '#171d2d' : '#f9fbff');
        document.documentElement.style.setProperty('--panel-alt', isDark ? '#1d2640' : '#edf3ff');
        document.documentElement.style.setProperty('--panel-soft', isDark ? '#222d46' : '#eef4ff');
        document.documentElement.style.setProperty('--border', isDark ? 'rgba(148,163,184,0.18)' : 'rgba(99, 120, 161, 0.15)');
        document.documentElement.style.setProperty('--text', isDark ? '#e7ebff' : '#1b2438');
        document.documentElement.style.setProperty('--muted', isDark ? '#9aa8c7' : '#5f6c88');
        document.documentElement.style.setProperty('--primary', isDark ? '#7c8cff' : '#4d64ff');
        document.documentElement.style.setProperty('--primary-strong', isDark ? '#92a0ff' : '#394ef7');
        document.documentElement.style.setProperty('--primary-soft', isDark ? 'rgba(124,140,255,0.18)' : 'rgba(77,100,255,0.12)');
        document.documentElement.style.setProperty('--accent', isDark ? '#7ee7d8' : '#1ca8a2');
        document.documentElement.style.setProperty('--danger', isDark ? '#ff8d8d' : '#e45555');
        document.documentElement.style.setProperty('--shadow', isDark ? '0 18px 40px rgba(7,10,19,0.45)' : '0 18px 40px rgba(68, 87, 140, 0.18)');

        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      }

      function exportNotes() {
        const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `notes-export-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function importNotes(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!Array.isArray(parsed)) throw new Error('Invalid file');

            notes = parsed.map(note => ({
              id: note.id || crypto.randomUUID(),
              title: note.title || 'Untitled',
              content: note.content || '',
              tags: Array.isArray(note.tags) ? note.tags : [],
              pinned: Boolean(note.pinned),
              createdAt: note.createdAt || new Date().toISOString(),
              updatedAt: note.updatedAt || new Date().toISOString()
            }));

            activeNoteId = notes[0]?.id || null;
            saveNotes();
            renderNotes();
            renderEditor();
          } catch (err) {
            alert('Could not import notes. Use a valid JSON export from this app.');
          } finally {
            event.target.value = '';
          }
        };

        reader.readAsText(file);
      }

      document.getElementById('newNoteBtn').addEventListener('click', createNote);
      document.getElementById('deleteNoteBtn').addEventListener('click', deleteCurrentNote);
      document.getElementById('pinToggleBtn').addEventListener('click', togglePin);
      document.getElementById('exportBtn').addEventListener('click', exportNotes);
      document.getElementById('importBtn').addEventListener('click', () => fileInputEl.click());
      fileInputEl.addEventListener('change', importNotes);

      document.querySelectorAll('.filter-chip').forEach(button => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          document.querySelectorAll('.filter-chip').forEach(item => item.classList.toggle('active', item === button));
          renderNotes();
        });
      });

      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const current = localStorage.getItem(THEME_KEY) === 'dark';
        setTheme(!current);
      });

      searchInputEl.addEventListener('input', (event) => {
        currentSearch = event.target.value.trim();
        renderNotes();
      });

      noteTitleEl.addEventListener('input', saveCurrentNote);
      noteTagsEl.addEventListener('input', saveCurrentNote);
      noteContentEl.addEventListener('input', () => {
        saveCurrentNote();
        const current = getActiveNote();
        if (!current) return;
        wordCountEl.textContent = countWords(current.content) + ' words';
        tagCountEl.textContent = (current.tags || []).length + ' tags';
      });

      const preferredTheme = localStorage.getItem(THEME_KEY) || 'dark';
      setTheme(preferredTheme === 'dark');
      activeNoteId = notes[0]?.id || null;
      renderNotes();
      renderEditor();
    </script>
  </body>
</html>
