<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Nest – Material 3</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    
    <!-- Material Web Library -->
    <script async src="https://cdn.jsdelivr.net/npm/@material/web@1.0.0-rc.1/bundle.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Roboto, sans-serif;
        background-color: #fffbfe;
        color: #1c1b1f;
      }

      html[data-theme="dark"] {
        background-color: #1c1b1f;
        color: #e6e1e6;
      }

      .app-container {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      md-top-app-bar {
        --md-sys-color-surface-container-highest: #e8e4ed;
      }

      html[data-theme="dark"] md-top-app-bar {
        --md-sys-color-surface-container-highest: #36343b;
      }

      .app-title {
        font-size: 22px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .sidebar {
        width: 320px;
        background-color: #fffbfe;
        border-right: 1px solid #c4c7c5;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      html[data-theme="dark"] .sidebar {
        background-color: #1c1b1f;
        border-right-color: #49454e;
      }

      .sidebar-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar-label {
        font-size: 12px;
        font-weight: 500;
        color: #49454e;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      html[data-theme="dark"] .sidebar-label {
        color: #b0adb5;
      }

      .category-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .note-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        flex: 1;
      }

      .note-item {
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: #f7f2fa;
        text-align: left;
      }

      html[data-theme="dark"] .note-item {
        background-color: #2b2930;
      }

      .note-item:hover {
        background-color: #f3edf7;
      }

      html[data-theme="dark"] .note-item:hover {
        background-color: #36343b;
      }

      .note-item.active {
        background-color: #eaddff;
      }

      html[data-theme="dark"] .note-item.active {
        background-color: #4f378b;
      }

      .note-item-title {
        font-size: 14px;
        font-weight: 500;
        color: #1c1b1f;
        margin: 0 0 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      html[data-theme="dark"] .note-item-title {
        color: #e6e1e6;
      }

      .note-item-meta {
        font-size: 12px;
        color: #49454e;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      html[data-theme="dark"] .note-item-meta {
        color: #b0adb5;
      }

      .editor-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .editor-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #49454e;
        font-size: 16px;
      }

      html[data-theme="dark"] .editor-empty {
        color: #b0adb5;
      }

      .editor-area {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .editor-content {
        padding: 32px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
        overflow-y: auto;
        flex: 1;
      }

      .editor-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }

      .editor-title-section {
        flex: 1;
      }

      .editor-title {
        font-size: 28px;
        font-weight: 400;
        border: none;
        background: transparent;
        color: #1c1b1f;
        width: 100%;
        outline: none;
        margin: 0 0 12px;
      }

      html[data-theme="dark"] .editor-title {
        color: #e6e1e6;
      }

      .editor-section {
        margin-bottom: 24px;
      }

      .editor-label {
        font-size: 12px;
        font-weight: 500;
        color: #49454e;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        display: block;
      }

      html[data-theme="dark"] .editor-label {
        color: #b0adb5;
      }

      .editor-meta {
        display: flex;
        gap: 24px;
        font-size: 12px;
        color: #49454e;
        margin-top: 16px;
      }

      html[data-theme="dark"] .editor-meta {
        color: #b0adb5;
      }

      .hidden {
        display: none !important;
      }

      md-filled-text-field,
      md-filled-select {
        width: 100%;
      }

      @media (max-width: 960px) {
        .main-content {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          max-height: 200px;
          border-right: none;
          border-bottom: 1px solid #c4c7c5;
          flex-direction: row;
          overflow-x: auto;
          gap: 16px;
        }

        html[data-theme="dark"] .sidebar {
          border-bottom-color: #49454e;
        }

        .sidebar-section {
          flex-direction: row;
          min-width: fit-content;
        }

        .category-list {
          flex-direction: row;
        }

        .note-list {
          flex-direction: row;
          flex: 0;
        }

        .note-item {
          min-width: 200px;
        }

        .editor-content {
          padding: 24px 16px;
        }

        .editor-title {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <md-top-app-bar headline="Note Nest">
        <md-icon-button href="#" slot="navigationIcon">
          <md-icon>note</md-icon>
        </md-icon-button>
        <div slot="headline" class="app-title" style="margin-left: 16px;">Note Nest</div>
        <div style="flex: 1; margin: 0 16px; display: flex; align-items: center;">
          <md-filled-text-field 
            id="searchInput" 
            label="Search notes" 
            type="search"
            style="max-width: 400px;">
            <md-icon slot="leading-icon">search</md-icon>
          </md-filled-text-field>
        </div>
        <div class="top-actions" slot="trailingIcon">
          <md-icon-button id="themeToggleBtn">
            <md-icon>dark_mode</md-icon>
          </md-icon-button>
          <md-icon-button id="importBtn">
            <md-icon>upload</md-icon>
          </md-icon-button>
          <md-icon-button id="exportBtn">
            <md-icon>download</md-icon>
          </md-icon-button>
          <md-filled-button id="newNoteBtn">
            <md-icon slot="icon">add</md-icon>
            New
          </md-filled-button>
        </div>
      </md-top-app-bar>

      <div class="main-content">
        <aside class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-label">Categories</div>
            <div class="category-list" id="categoryList"></div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-label">Notes</div>
            <ul class="note-list" id="noteList"></ul>
          </div>
        </aside>

        <div class="editor-container">
          <div id="editorEmpty" class="editor-empty">
            Select or create a note to begin writing
          </div>

          <div id="editorArea" class="editor-area hidden">
            <div class="editor-content">
              <div class="editor-header">
                <div class="editor-title-section">
                  <input id="noteTitle" class="editor-title" type="text" placeholder="Untitled note" />
                  <div style="display: flex; gap: 12px; align-items: center; margin-top: 12px;">
                    <span class="editor-label" style="margin: 0;">Category</span>
                    <md-filled-select id="noteCategory">
                      <md-select-option selected>
                        <div slot="headline">Select category</div>
                      </md-select-option>
                    </md-filled-select>
                  </div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <md-icon-button id="pinToggleBtn">
                    <md-icon>bookmark_border</md-icon>
                  </md-icon-button>
                  <md-icon-button id="deleteNoteBtn">
                    <md-icon>delete</md-icon>
                  </md-icon-button>
                </div>
              </div>

              <div class="editor-section">
                <label class="editor-label" for="noteTags">Tags</label>
                <md-filled-text-field 
                  id="noteTags" 
                  label="Add tags separated by commas">
                </md-filled-text-field>
              </div>

              <div class="editor-section">
                <label class="editor-label" for="noteContent">Content</label>
                <textarea id="noteContent" style="
                  width: 100%;
                  min-height: 400px;
                  padding: 12px 16px;
                  border: 1px solid #c4c7c5;
                  border-radius: 8px;
                  background-color: #f7f2fa;
                  color: #1c1b1f;
                  font-size: 14px;
                  font-family: Roboto, sans-serif;
                  outline: none;
                  resize: vertical;
                  line-height: 1.5;
                " placeholder="Start typing..."></textarea>
              </div>

              <div style="margin-top: 24px;">
                <div class="editor-meta">
                  <span id="createdAt">Created —</span>
                  <span id="updatedAt">Updated —</span>
                  <span id="wordCount">0 words</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input id="fileInput" class="hidden" type="file" accept="application/json" />

    <script>
      const STORAGE_KEY = 'note-nest-v5';
      const THEME_KEY = 'note-nest-theme';
      const CATEGORIES_KEY = 'note-nest-categories';

      const noteListEl = document.getElementById('noteList');
      const editorEmptyEl = document.getElementById('editorEmpty');
      const editorAreaEl = document.getElementById('editorArea');
      const noteTitleEl = document.getElementById('noteTitle');
      const noteTagsEl = document.getElementById('noteTags');
      const noteContentEl = document.getElementById('noteContent');
      const noteCategoryEl = document.getElementById('noteCategory');
      const categoryListEl = document.getElementById('categoryList');
      const createdAtEl = document.getElementById('createdAt');
      const updatedAtEl = document.getElementById('updatedAt');
      const wordCountEl = document.getElementById('wordCount');
      const searchInputEl = document.getElementById('searchInput');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const fileInputEl = document.getElementById('fileInput');

      let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let categories = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || '["Personal", "Work", "Ideas", "Archive"]');
      let activeNoteId = null;
      let currentSearch = '';

      const defaultCategories = ['Personal', 'Work', 'Ideas', 'Archive'];

      function initDemoNotes() {
        notes = [
          {
            id: crypto.randomUUID(),
            title: 'Project Roadmap',
            content: 'Q4 Initiatives:\n\nFeatures:\n- User authentication\n- Dark mode support\n- Export functionality\n- Categories system\n\nBug Fixes:\n- Search performance\n- Mobile responsiveness',
            tags: ['work', 'planning'],
            category: 'Work',
            pinned: true,
            createdAt: new Date(Date.now() - 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 900000).toISOString()
          },
          {
            id: crypto.randomUUID(),
            title: 'Vacation ideas',
            content: 'Places to visit:\n- Japan (cherry blossoms)\n- Iceland (northern lights)\n- Switzerland (hiking)\n\nBest time: Spring or Fall',
            tags: ['personal', 'travel'],
            category: 'Personal',
            pinned: false,
            createdAt: new Date(Date.now() - 2 * 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 3 * 3600000).toISOString()
          },
          {
            id: crypto.randomUUID(),
            title: 'Creative writing prompt',
            content: 'Write a story about someone discovering a hidden library in their attic. Explore the mysteries within its pages and how it changes their life.',
            tags: ['ideas', 'creative'],
            category: 'Ideas',
            pinned: false,
            createdAt: new Date(Date.now() - 5 * 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 5 * 86400000).toISOString()
          }
        ];
        categories = defaultCategories;
        activeNoteId = notes[0].id;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
      }

      if (!notes.length) {
        initDemoNotes();
      }

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function saveCategories() {
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
      }

      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleString([], {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      function countWords(text) {
        return text.trim().split(/\s+/).filter(Boolean).length;
      }

      function getFilteredNotes() {
        let list = [...notes];

        if (currentSearch) {
          const search = currentSearch.toLowerCase();
          list = list.filter(note => {
            const haystack = `${note.title} ${note.content} ${note.tags.join(' ')}`.toLowerCase();
            return haystack.includes(search);
          });
        }

        return list.sort((a, b) => {
          if (a.pinned !== b.pinned) return Number(b.pinned) - Number(a.pinned);
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        });
      }

      function escapeHtml(str = '') {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getActiveNote() {
        return notes.find(note => note.id === activeNoteId) || null;
      }

      function renderCategories() {
        categoryListEl.innerHTML = '';

        categories.forEach((category) => {
          const button = document.createElement('md-filled-tonal-button');
          button.innerHTML = `<md-icon slot="icon">folder</md-icon>${category}`;
          button.style.marginBottom = '8px';
          button.addEventListener('click', () => {
            const filtered = notes.filter(n => n.category === category);
            if (filtered.length > 0) {
              activeNoteId = filtered[0].id;
              renderNotes();
              renderEditor();
            }
          });
          categoryListEl.appendChild(button);
        });
      }

      function renderNotes() {
        const filtered = getFilteredNotes();
        noteListEl.innerHTML = '';

        if (!filtered.length) {
          const li = document.createElement('li');
          li.style.cssText = 'color: #49454e; font-size: 12px;';
          li.textContent = 'No notes';
          noteListEl.appendChild(li);
          return;
        }

        filtered.forEach(note => {
          const li = document.createElement('li');
          li.className = 'note-item' + (note.id === activeNoteId ? ' active' : '');
          li.innerHTML = `
            <div class="note-item-title" title="${escapeHtml(note.title || 'Untitled')}">${escapeHtml(note.title || 'Untitled')}${note.pinned ? ' 📌' : ''}</div>
            <div class="note-item-meta">${note.category} • ${formatDate(note.updatedAt)}</div>
          `;
          li.addEventListener('click', () => {
            activeNoteId = note.id;
            renderNotes();
            renderEditor();
          });
          noteListEl.appendChild(li);
        });
      }

      function renderEditor() {
        const note = getActiveNote();

        if (!note) {
          editorAreaEl.classList.add('hidden');
          editorEmptyEl.style.display = 'flex';
          return;
        }

        editorEmptyEl.style.display = 'none';
        editorAreaEl.classList.remove('hidden');
        noteTitleEl.value = note.title || '';
        noteTagsEl.value = (note.tags || []).join(', ');
        noteContentEl.value = note.content || '';
        noteCategoryEl.value = note.category || '';
        createdAtEl.textContent = 'Created ' + formatDate(note.createdAt);
        updatedAtEl.textContent = 'Updated ' + formatDate(note.updatedAt);
        wordCountEl.textContent = countWords(note.content) + ' words';
        const pinBtn = document.getElementById('pinToggleBtn');
        pinBtn.innerHTML = `<md-icon>${note.pinned ? 'bookmark' : 'bookmark_border'}</md-icon>`;
      }

      function createNote() {
        const now = new Date().toISOString();
        const newNote = {
          id: crypto.randomUUID(),
          title: 'Untitled note',
          content: '',
          tags: [],
          category: categories[0] || 'Personal',
          pinned: false,
          createdAt: now,
          updatedAt: now
        };

        notes.unshift(newNote);
        activeNoteId = newNote.id;
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function saveCurrentNote() {
        const note = getActiveNote();
        if (!note) return;

        note.title = noteTitleEl.value.trim() || 'Untitled';
        note.tags = noteTagsEl.value
          .split(',')
          .map(tag => tag.trim())
          .filter(Boolean)
          .filter((tag, index, arr) => arr.indexOf(tag) === index);
        note.category = noteCategoryEl.value || 'Personal';
        note.content = noteContentEl.value;
        note.updatedAt = new Date().toISOString();

        saveNotes();
        renderNotes();
        renderEditor();
      }

      function deleteCurrentNote() {
        const note = getActiveNote();
        if (!note) return;

        const ok = window.confirm(`Delete "${note.title}"?`);
        if (!ok) return;

        notes = notes.filter(n => n.id !== note.id);
        activeNoteId = notes[0] ? notes[0].id : null;
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function togglePin() {
        const note = getActiveNote();
        if (!note) return;

        note.pinned = !note.pinned;
        note.updatedAt = new Date().toISOString();
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function setTheme(isDark) {
        const html = document.documentElement;
        if (isDark) {
          html.setAttribute('data-theme', 'dark');
          themeToggleBtn.innerHTML = '<md-icon>light_mode</md-icon>';
        } else {
          html.removeAttribute('data-theme');
          themeToggleBtn.innerHTML = '<md-icon>dark_mode</md-icon>';
        }
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      }

      function exportNotes() {
        const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `notes-export-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function importNotes(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!Array.isArray(parsed)) throw new Error('Invalid format');
            notes = parsed.map(n => ({
              id: n.id || crypto.randomUUID(),
              title: n.title || 'Untitled',
              content: n.content || '',
              tags: Array.isArray(n.tags) ? n.tags : [],
              category: n.category || categories[0] || 'Personal',
              pinned: Boolean(n.pinned),
              createdAt: n.createdAt || new Date().toISOString(),
              updatedAt: n.updatedAt || new Date().toISOString()
            }));
            activeNoteId = notes[0]?.id || null;
            saveNotes();
            renderNotes();
            renderEditor();
          } catch (err) {
            alert('Could not import notes.');
          } finally {
            event.target.value = '';
          }
        };

        reader.readAsText(file);
      }

      // Wait for Material Web to load
      window.addEventListener('load', () => {
        document.getElementById('newNoteBtn').addEventListener('click', createNote);
        document.getElementById('deleteNoteBtn').addEventListener('click', deleteCurrentNote);
        document.getElementById('pinToggleBtn').addEventListener('click', togglePin);
        document.getElementById('exportBtn').addEventListener('click', exportNotes);
        document.getElementById('importBtn').addEventListener('click', () => fileInputEl.click());
        fileInputEl.addEventListener('change', importNotes);
        themeToggleBtn.addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          setTheme(!isDark);
        });

        searchInputEl.addEventListener('input', (event) => {
          currentSearch = event.target.value.trim();
          renderNotes();
        });

        noteTitleEl.addEventListener('input', saveCurrentNote);
        noteTagsEl.addEventListener('input', saveCurrentNote);
        noteContentEl.addEventListener('input', () => {
          saveCurrentNote();
          wordCountEl.textContent = countWords(noteContentEl.value) + ' words';
        });
        noteCategoryEl.addEventListener('change', saveCurrentNote);

        const savedTheme = localStorage.getItem(THEME_KEY) === 'dark';
        setTheme(savedTheme);

        function updateCategoryDropdown() {
          const existingOptions = noteCategoryEl.querySelectorAll('md-select-option:not([selected])');
          existingOptions.forEach(opt => opt.remove());
          categories.forEach(cat => {
            const option = document.createElement('md-select-option');
            option.innerHTML = `<div slot="headline">${cat}</div>`;
            noteCategoryEl.appendChild(option);
          });
        }

        activeNoteId = notes[0]?.id || null;
        renderCategories();
        renderNotes();
        renderEditor();
        updateCategoryDropdown();
      });
    </script>
  </body>
</html>
