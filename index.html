<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Nest – Material 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    
    <style>
      :root {
        --md-sys-color-primary: #6750a4;
        --md-sys-color-primary-container: #eaddff;
        --md-sys-color-secondary: #625b71;
        --md-sys-color-secondary-container: #e8def8;
        --md-sys-color-tertiary: #7d5260;
        --md-sys-color-tertiary-container: #ffd8e4;
        --md-sys-color-error: #b3261e;
        --md-sys-color-error-container: #f9dedc;
        --md-sys-color-outline: #79747e;
        --md-sys-color-outline-variant: #c4c7c5;
        --md-sys-color-background: #fffbfe;
        --md-sys-color-surface: #fffbfe;
        --md-sys-color-surface-variant: #e7e0ec;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-on-secondary: #ffffff;
        --md-sys-color-on-tertiary: #ffffff;
        --md-sys-color-on-error: #ffffff;
        --md-sys-color-on-background: #1c1b1f;
        --md-sys-color-on-surface: #1c1b1f;
        --md-sys-color-scrim: #000000;
        --md-sys-color-surface-dim: #ded8e1;
        --md-sys-color-surface-bright: #fffbfe;
        --md-sys-color-surface-container-lowest: #ffffff;
        --md-sys-color-surface-container-low: #f7f2fa;
        --md-sys-color-surface-container: #f3edf7;
        --md-sys-color-surface-container-high: #ede9f3;
        --md-sys-color-surface-container-highest: #e8e4ed;
      }

      html[data-theme="dark"] {
        --md-sys-color-primary: #d0bcff;
        --md-sys-color-primary-container: #4f378b;
        --md-sys-color-secondary: #ccc7d8;
        --md-sys-color-secondary-container: #48454e;
        --md-sys-color-tertiary: #f6d6e6;
        --md-sys-color-tertiary-container: #633b48;
        --md-sys-color-error: #f2b8b5;
        --md-sys-color-error-container: #8c1d18;
        --md-sys-color-outline: #9e9da0;
        --md-sys-color-outline-variant: #49454e;
        --md-sys-color-background: #1c1b1f;
        --md-sys-color-surface: #1c1b1f;
        --md-sys-color-surface-variant: #49454e;
        --md-sys-color-on-primary: #371e73;
        --md-sys-color-on-secondary: #332d35;
        --md-sys-color-on-tertiary: #493d44;
        --md-sys-color-on-error: #601410;
        --md-sys-color-on-background: #e6e1e6;
        --md-sys-color-on-surface: #e6e1e6;
        --md-sys-color-scrim: #000000;
        --md-sys-color-surface-dim: #11100b;
        --md-sys-color-surface-bright: #2b2930;
        --md-sys-color-surface-container-lowest: #0f0e14;
        --md-sys-color-surface-container-low: #231f26;
        --md-sys-color-surface-container: #2b2930;
        --md-sys-color-surface-container-high: #36343b;
        --md-sys-color-surface-container-highest: #413f46;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Roboto, sans-serif;
        background-color: var(--md-sys-color-background);
        color: var(--md-sys-color-on-background);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .material-icons {
        font-family: 'Material Icons';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
        vertical-align: middle;
      }

      .app-container {
        display: flex;
        min-height: 100vh;
      }

      .app-bar {
        background-color: var(--md-sys-color-surface-container-highest);
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.12), 0 1px 2px -1px rgba(0, 0, 0, 0.12);
        gap: 16px;
      }

      .app-title {
        font-size: 24px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .app-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .md-button {
        border: none;
        border-radius: 24px;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .md-button-filled {
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
      }

      .md-button-filled:hover {
        background-color: var(--md-sys-color-primary);
        opacity: 0.92;
      }

      .md-button-outlined {
        border: 1px solid var(--md-sys-color-outline);
        background-color: transparent;
        color: var(--md-sys-color-primary);
      }

      .md-button-outlined:hover {
        background-color: var(--md-sys-color-primary-container);
      }

      .md-button-text {
        background-color: transparent;
        color: var(--md-sys-color-primary);
      }

      .md-button-text:hover {
        background-color: var(--md-sys-color-primary-container);
      }

      .search-field {
        flex: 1;
        max-width: 400px;
        display: flex;
        align-items: center;
        background-color: var(--md-sys-color-surface-container-low);
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: 24px;
        padding: 0 16px;
        gap: 8px;
      }

      .search-field input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--md-sys-color-on-surface);
        font-size: 14px;
        outline: none;
      }

      .search-field input::placeholder {
        color: var(--md-sys-color-outline);
      }

      .main-content {
        display: flex;
        width: 100%;
        height: calc(100vh - 64px);
      }

      .sidebar {
        width: 320px;
        background-color: var(--md-sys-color-surface);
        border-right: 1px solid var(--md-sys-color-outline-variant);
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .sidebar-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--md-sys-color-on-surface-variant);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .category-item {
        padding: 12px 16px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: transparent;
        color: var(--md-sys-color-on-surface);
        border: none;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .category-item:hover {
        background-color: var(--md-sys-color-surface-container);
      }

      .category-item.active {
        background-color: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-primary);
      }

      .note-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        flex: 1;
      }

      .note-item {
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: var(--md-sys-color-surface-container-low);
        border: 1px solid transparent;
        text-align: left;
      }

      .note-item:hover {
        background-color: var(--md-sys-color-surface-container);
      }

      .note-item.active {
        background-color: var(--md-sys-color-primary-container);
        border-color: var(--md-sys-color-primary);
      }

      .note-item-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--md-sys-color-on-surface);
        margin: 0 0 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .note-item-meta {
        font-size: 12px;
        color: var(--md-sys-color-on-surface-variant);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .editor-container {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .editor-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--md-sys-color-on-surface-variant);
        font-size: 16px;
      }

      .editor-content {
        padding: 32px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
      }

      .editor-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }

      .editor-title-section {
        flex: 1;
      }

      .editor-title {
        font-size: 28px;
        font-weight: 400;
        border: none;
        background: transparent;
        color: var(--md-sys-color-on-background);
        width: 100%;
        outline: none;
        margin: 0 0 8px;
      }

      .editor-category-bar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
      }

      .md-chip {
        background-color: var(--md-sys-color-secondary-container);
        color: var(--md-sys-color-on-secondary-container);
        border-radius: 16px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .editor-control-row {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }

      .md-text-field {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .md-text-field input,
      .md-text-field textarea {
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 8px;
        padding: 12px 16px;
        background-color: var(--md-sys-color-surface-container-low);
        color: var(--md-sys-color-on-surface);
        font-size: 14px;
        font-family: Roboto, sans-serif;
        outline: none;
        transition: all 0.2s ease;
      }

      .md-text-field input:focus,
      .md-text-field textarea:focus {
        border-color: var(--md-sys-color-primary);
        background-color: var(--md-sys-color-surface-container);
        box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.1);
      }

      .md-text-field textarea {
        resize: vertical;
        min-height: 300px;
        font-family: 'Monaco', 'Courier New', monospace;
        line-height: 1.5;
      }

      .editor-meta {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: var(--md-sys-color-on-surface-variant);
        margin-top: 16px;
      }

      .bottom-bar {
        background-color: var(--md-sys-color-surface-container-lowest);
        border-top: 1px solid var(--md-sys-color-outline-variant);
        padding: 16px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      @media (max-width: 960px) {
        .main-content {
          flex-direction: column;
          height: auto;
        }

        .sidebar {
          width: 100%;
          max-height: 200px;
          border-right: none;
          border-bottom: 1px solid var(--md-sys-color-outline-variant);
          flex-direction: row;
          overflow-x: auto;
          gap: 16px;
        }

        .sidebar-section {
          flex-direction: row;
          min-width: fit-content;
        }

        .note-list {
          flex-direction: row;
          flex: 0;
        }

        .note-item {
          min-width: 200px;
        }

        .editor-container {
          height: auto;
        }

        .editor-content {
          padding: 24px 16px;
        }

        .editor-title {
          font-size: 24px;
        }

        .search-field {
          max-width: 100%;
        }
      }

      .on-surface-variant {
        color: var(--md-sys-color-on-surface-variant);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app-bar">
      <div class="app-title">
        <span class="material-icons">note</span>
        Note Nest
      </div>
      <div class="search-field">
        <span class="material-icons">search</span>
        <input id="searchInput" type="text" placeholder="Search notes..." />
      </div>
      <div class="app-actions">
        <button class="md-button md-button-text" id="themeToggleBtn">
          <span class="material-icons">dark_mode</span>
        </button>
        <button class="md-button md-button-outlined" id="importBtn">
          <span class="material-icons">upload</span>
          Import
        </button>
        <button class="md-button md-button-outlined" id="exportBtn">
          <span class="material-icons">download</span>
          Export
        </button>
        <button class="md-button md-button-filled" id="newNoteBtn">
          <span class="material-icons">add</span>
          New
        </button>
      </div>
    </div>

    <div class="main-content">
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-label">Categories</div>
          <div id="categoryList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">Notes</div>
          <ul class="note-list" id="noteList"></ul>
        </div>
      </aside>

      <div class="editor-container">
        <div id="editorEmpty" class="editor-empty">
          Select or create a note to begin writing
        </div>

        <div id="editorArea" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
          <div class="editor-content" style="overflow-y: auto; flex: 1;">
            <div class="editor-header">
              <div class="editor-title-section">
                <input id="noteTitle" class="editor-title" type="text" placeholder="Untitled note" />
                <div class="editor-category-bar">
                  <select id="noteCategory" class="md-chip" style="border: 1px solid var(--md-sys-color-outline); background-color: var(--md-sys-color-surface-container-low); color: var(--md-sys-color-on-surface); padding: 8px 12px; cursor: pointer;">
                    <option value="">Select category</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; gap: 8px;">
                <button class="md-button md-button-outlined" id="pinToggleBtn">
                  <span class="material-icons">bookmark_border</span>
                </button>
                <button class="md-button md-button-outlined" id="deleteNoteBtn">
                  <span class="material-icons">delete</span>
                </button>
              </div>
            </div>

            <div style="margin-bottom: 24px;">
              <div class="md-text-field">
                <label style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">Tags</label>
                <input id="noteTags" type="text" placeholder="Add tags separated by commas" />
              </div>
            </div>

            <div class="md-text-field">
              <label style="font-size: 12px; color: var(--md-sys-color-on-surface-variant);">Content</label>
              <textarea id="noteContent" placeholder="Start typing..."></textarea>
            </div>

            <div class="editor-meta">
              <span id="createdAt">Created —</span>
              <span id="updatedAt">Updated —</span>
              <span id="wordCount">0 words</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input id="fileInput" class="hidden" type="file" accept="application/json" />

    <script>
      const STORAGE_KEY = 'note-nest-v3';
      const THEME_KEY = 'note-nest-theme';
      const CATEGORIES_KEY = 'note-nest-categories';

      const noteListEl = document.getElementById('noteList');
      const editorEmptyEl = document.getElementById('editorEmpty');
      const editorAreaEl = document.getElementById('editorArea');
      const noteTitleEl = document.getElementById('noteTitle');
      const noteTagsEl = document.getElementById('noteTags');
      const noteContentEl = document.getElementById('noteContent');
      const noteCategoryEl = document.getElementById('noteCategory');
      const categoryListEl = document.getElementById('categoryList');
      const createdAtEl = document.getElementById('createdAt');
      const updatedAtEl = document.getElementById('updatedAt');
      const wordCountEl = document.getElementById('wordCount');
      const searchInputEl = document.getElementById('searchInput');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const fileInputEl = document.getElementById('fileInput');

      let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let categories = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || '["Personal", "Work", "Ideas", "Archive"]');
      let activeNoteId = null;
      let currentSearch = '';

      const defaultCategories = ['Personal', 'Work', 'Ideas', 'Archive'];

      function initDemoNotes() {
        notes = [
          {
            id: crypto.randomUUID(),
            title: 'Project Roadmap',
            content: '# Q4 Initiatives\n\n## Features\n- User authentication\n- Dark mode support\n- Export functionality\n- Categories system\n\n## Bug Fixes\n- Search performance\n- Mobile responsiveness',
            tags: ['work', 'planning'],
            category: 'Work',
            pinned: true,
            createdAt: new Date(Date.now() - 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 900000).toISOString()
          },
          {
            id: crypto.randomUUID(),
            title: 'Vacation ideas',
            content: 'Places to visit:\n- Japan (cherry blossoms)\n- Iceland (northern lights)\n- Switzerland (hiking)\n\nBest time: Spring or Fall',
            tags: ['personal', 'travel'],
            category: 'Personal',
            pinned: false,
            createdAt: new Date(Date.now() - 2 * 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 3 * 3600000).toISOString()
          },
          {
            id: crypto.randomUUID(),
            title: 'Creative writing prompt',
            content: 'Write a story about someone discovering a hidden library in their attic. Explore the mysteries within its pages and how it changes their life.',
            tags: ['ideas', 'creative'],
            category: 'Ideas',
            pinned: false,
            createdAt: new Date(Date.now() - 5 * 86400000).toISOString(),
            updatedAt: new Date(Date.now() - 5 * 86400000).toISOString()
          }
        ];
        categories = defaultCategories;
        activeNoteId = notes[0].id;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
      }

      if (!notes.length) {
        initDemoNotes();
      }

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function saveCategories() {
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
      }

      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleString([], {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      function countWords(text) {
        return text.trim().split(/\s+/).filter(Boolean).length;
      }

      function getFilteredNotes() {
        let list = [...notes];

        if (currentSearch) {
          const search = currentSearch.toLowerCase();
          list = list.filter(note => {
            const haystack = `${note.title} ${note.content} ${note.tags.join(' ')}`.toLowerCase();
            return haystack.includes(search);
          });
        }

        return list.sort((a, b) => {
          if (a.pinned !== b.pinned) return Number(b.pinned) - Number(a.pinned);
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        });
      }

      function escapeHtml(str = '') {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getActiveNote() {
        return notes.find(note => note.id === activeNoteId) || null;
      }

      function renderCategories() {
        categoryListEl.innerHTML = '';

        categories.forEach((category, index) => {
          const button = document.createElement('button');
          button.className = 'category-item';
          button.innerHTML = `<span class="material-icons">folder</span> ${category}`;
          button.addEventListener('click', () => {
            // Filter notes by category
            const filtered = notes.filter(n => n.category === category);
            if (filtered.length > 0) {
              activeNoteId = filtered[0].id;
              renderNotes();
              renderEditor();
            }
          });
          categoryListEl.appendChild(button);
        });
      }

      function renderNotes() {
        const filtered = getFilteredNotes();
        noteListEl.innerHTML = '';

        if (!filtered.length) {
          noteListEl.innerHTML = '<li style="color: var(--md-sys-color-on-surface-variant); font-size: 12px;">No notes</li>';
          return;
        }

        filtered.forEach(note => {
          const li = document.createElement('li');
          li.className = 'note-item' + (note.id === activeNoteId ? ' active' : '');
          li.innerHTML = `
            <div class="note-item-title" title="${escapeHtml(note.title || 'Untitled')}">${escapeHtml(note.title || 'Untitled')}${note.pinned ? ' 📌' : ''}</div>
            <div class="note-item-meta">${note.category} • ${formatDate(note.updatedAt)}</div>
          `;
          li.addEventListener('click', () => {
            activeNoteId = note.id;
            renderNotes();
            renderEditor();
          });
          noteListEl.appendChild(li);
        });
      }

      function renderEditor() {
        const note = getActiveNote();

        if (!note) {
          editorAreaEl.classList.add('hidden');
          editorEmptyEl.style.display = 'flex';
          return;
        }

        editorEmptyEl.style.display = 'none';
        editorAreaEl.classList.remove('hidden');
        noteTitleEl.value = note.title || '';
        noteTagsEl.value = (note.tags || []).join(', ');
        noteContentEl.value = note.content || '';
        noteCategoryEl.value = note.category || '';
        createdAtEl.textContent = 'Created ' + formatDate(note.createdAt);
        updatedAtEl.textContent = 'Updated ' + formatDate(note.updatedAt);
        wordCountEl.textContent = countWords(note.content) + ' words';
        document.getElementById('pinToggleBtn').innerHTML = `<span class="material-icons">${note.pinned ? 'bookmark' : 'bookmark_border'}</span>`;
      }

      function createNote() {
        const now = new Date().toISOString();
        const newNote = {
          id: crypto.randomUUID(),
          title: 'Untitled note',
          content: '',
          tags: [],
          category: categories[0] || 'Personal',
          pinned: false,
          createdAt: now,
          updatedAt: now
        };

        notes.unshift(newNote);
        activeNoteId = newNote.id;
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function saveCurrentNote() {
        const note = getActiveNote();
        if (!note) return;

        note.title = noteTitleEl.value.trim() || 'Untitled';
        note.tags = noteTagsEl.value
          .split(',')
          .map(tag => tag.trim())
          .filter(Boolean)
          .filter((tag, index, arr) => arr.indexOf(tag) === index);
        note.category = noteCategoryEl.value || 'Personal';
        note.content = noteContentEl.value;
        note.updatedAt = new Date().toISOString();

        saveNotes();
        renderNotes();
        renderEditor();
      }

      function deleteCurrentNote() {
        const note = getActiveNote();
        if (!note) return;

        const ok = window.confirm(`Delete "${note.title}"?`);
        if (!ok) return;

        notes = notes.filter(n => n.id !== note.id);
        activeNoteId = notes[0] ? notes[0].id : null;
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function togglePin() {
        const note = getActiveNote();
        if (!note) return;

        note.pinned = !note.pinned;
        note.updatedAt = new Date().toISOString();
        saveNotes();
        renderNotes();
        renderEditor();
      }

      function setTheme(isDark) {
        const html = document.documentElement;
        if (isDark) {
          html.setAttribute('data-theme', 'dark');
          themeToggleBtn.innerHTML = '<span class="material-icons">light_mode</span>';
        } else {
          html.removeAttribute('data-theme');
          themeToggleBtn.innerHTML = '<span class="material-icons">dark_mode</span>';
        }
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      }

      function exportNotes() {
        const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `notes-export-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function importNotes(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!Array.isArray(parsed)) throw new Error('Invalid format');
            notes = parsed.map(n => ({
              id: n.id || crypto.randomUUID(),
              title: n.title || 'Untitled',
              content: n.content || '',
              tags: Array.isArray(n.tags) ? n.tags : [],
              category: n.category || categories[0] || 'Personal',
              pinned: Boolean(n.pinned),
              createdAt: n.createdAt || new Date().toISOString(),
              updatedAt: n.updatedAt || new Date().toISOString()
            }));
            activeNoteId = notes[0]?.id || null;
            saveNotes();
            renderNotes();
            renderEditor();
          } catch (err) {
            alert('Could not import notes.');
          } finally {
            event.target.value = '';
          }
        };

        reader.readAsText(file);
      }

      document.getElementById('newNoteBtn').addEventListener('click', createNote);
      document.getElementById('deleteNoteBtn').addEventListener('click', deleteCurrentNote);
      document.getElementById('pinToggleBtn').addEventListener('click', togglePin);
      document.getElementById('exportBtn').addEventListener('click', exportNotes);
      document.getElementById('importBtn').addEventListener('click', () => fileInputEl.click());
      fileInputEl.addEventListener('change', importNotes);
      themeToggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        setTheme(!isDark);
      });

      searchInputEl.addEventListener('input', (event) => {
        currentSearch = event.target.value.trim();
        renderNotes();
      });

      noteTitleEl.addEventListener('input', saveCurrentNote);
      noteTagsEl.addEventListener('input', saveCurrentNote);
      noteContentEl.addEventListener('input', () => {
        saveCurrentNote();
        wordCountEl.textContent = countWords(noteContentEl.value) + ' words';
      });
      noteCategoryEl.addEventListener('change', saveCurrentNote);

      const savedTheme = localStorage.getItem(THEME_KEY) === 'dark';
      setTheme(savedTheme);

      // Populate category dropdown
      function updateCategoryDropdown() {
        const options = noteCategoryEl.querySelectorAll('option:not(:first-child)');
        options.forEach(opt => opt.remove());
        categories.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat;
          option.textContent = cat;
          noteCategoryEl.appendChild(option);
        });
      }

      activeNoteId = notes[0]?.id || null;
      renderCategories();
      renderNotes();
      renderEditor();
      updateCategoryDropdown();
    </script>
  </body>
</html>
