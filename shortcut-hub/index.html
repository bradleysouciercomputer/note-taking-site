<body>
<div id="app"><div style="min-height:100vh;display:grid;place-items:center;color:#82879c">Opening Hoplink…</div></div>
<div class="toastregion" id="toasts" aria-live="polite"></div>
<dialog id="editdialog"><div class="modalhead"><div><h2 id="dialogtitle">Add a shortcut</h2><p id="dialogsubtitle">Save a place you want to find again.</p></div><button class="iconbtn" type="button" id="close-dialog" aria-label="Close">×</button></div>
<form id="shortcutform"><div id="formmsg" class="msg"></div><div class="field"><label for="title">Name</label><input id="title" maxlength="80" required placeholder="My project board"></div><div class="field"><label for="url">Website URL</label><input id="url" required placeholder="https://example.com"></div><div class="field"><label for="description">Description · optional</label><textarea id="description" maxlength="280" placeholder="What do you use this for?"></textarea></div><div class="twocol"><div class="field"><label for="category">Category</label><input id="category" maxlength="40" list="categoryoptions" value="General" required><datalist id="categoryoptions"></datalist></div><div class="field"><label for="icon">Icon</label><select id="icon"><option>↗</option><option>🌐</option><option>✉️</option><option>🗓️</option><option>🎨</option><option>🎧</option><option>📚</option><option>💻</option><option>📊</option><option>🎮</option><option>🛍️</option><option>🧰</option><option>📝</option><option>🎬</option><option>📷</option><option>💡</option><option>🧭</option><option>☁️</option><option>⭐</option><option>🔖</option></select></div></div><div class="field"><label>Card color</label><div class="swatches" id="swatches"></div><input type="hidden" id="accent" value="#eeeaff"></div><label style="display:flex;align-items:center;gap:8px;color:#646a81;font-weight:600"><input type="checkbox" id="favorite" style="accent-color:#6e5be8"> Add to favorites</label><div class="modalactions"><button class="btn secondary" type="button" id="cancel-dialog">Cancel</button><button class="btn primary" type="submit" id="savebutton">Add shortcut</button></div></form></dialog>
<input id="importfile" type="file" accept=".json,application/json" class="hidden">
<script>
(function(){
const PROJECT_URL="https://seizegwhxlyfnwiztcvg.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_EQW2tlHoAxDpJiDA8d3OwQ_daUstahW";
const TABLE="hoplink_shortcuts", KEY="hoplink.supabase.config.v1";
const colors=["#eeeaff","#e4f7ef","#fff0e5","#e8f3ff","#ffe9ef","#f5eaff"];
const app=document.getElementById("app"),dlg=document.getElementById("editdialog");
let db=null,user=null,rows=[],filter="All shortcuts",search="",view="grid",editId=null,busy=false,accent=colors[0];
const $=s=>document.querySelector(s),esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(message,error){const el=document.createElement("div");el.className="toast"+(error?" error":"");el.textContent=message;$("#toasts").appendChild(el);setTimeout(()=>el.remove(),4000)}
function msg(form,text){const el=form.querySelector(".msg");if(el){el.textContent=text||"";el.classList.toggle("show",!!text)}}
function setBusy(btn,busy,label){const old=btn.innerHTML;btn.disabled=busy;if(busy)btn.innerHTML='<span class="spinner">◌</span> '+label;return()=>{btn.disabled=false;btn.innerHTML=old}}
function brand(){return '<div class="brand"><span class="logo">↗</span><span>hoplink</span></div>'}
function hero(){return '<aside class="hero">'+brand()+'<div class="herocopy"><div class="eyebrow">A little home for your links</div><h1>Your web.<br>Within reach.</h1><p>All the places you go online, gathered in one calm, personal dashboard. Save it once. Find it anywhere.</p><div class="features"><div><span class="featureicon">☁</span><span>Synced to your cloud</span></div><div><span class="featureicon">✦</span><span>Made for your workflow</span></div><div><span class="featureicon">⌕</span><span>Easy to find</span></div></div></div><div class="foot">Your links, your space. © '+new Date().getFullYear()+' Hoplink</div></aside>'}
function auth(mode){app.innerHTML='<div class="screen">'+hero()+'<main class="autharea"><section class="authcard"><h2>'+(mode==="signup"?"Create your account":mode==="reset"?"Reset your password":"Welcome back")+'</h2><p class="muted">'+(mode==="signup"?"Start gathering the links you use every day.":mode==="reset"?"We’ll email you a secure password reset link.":"Your favorite corners of the web are waiting.")+'</p>'+(mode!=="reset"?'<div class="tabs"><button type="button" data-mode="signin" class="'+(mode==="signin"?"active":"")+'">Sign in</button><button type="button" data-mode="signup" class="'+(mode==="signup"?"active":"")+'">Create account</button></div>':'')+'<form id="authform" data-mode="'+mode+'"><div class="msg" id="authmsg"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>'+(mode==="reset"?'':'<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="'+(mode==="signup"?"new-password":"current-password")+'" required placeholder="At least 8 characters"></div>')+(mode==="signin"?'<div style="text-align:right;margin:-4px 0 18px"><button class="link" type="button" id="forgot">Forgot password?</button></div>':'')+'<button class="btn primary wide" type="submit">'+(mode==="signup"?"Create account":mode==="reset"?"Send reset link":"Sign in")+' →</button></form><div class="hint">Connected to your personal cloud. <button id="changeproject" class="link" type="button">Change project</button><br>Hoplink uses Supabase email authentication.</div></section></main></div>'}
function cats(){return [...new Set(rows.map(x=>x.category||"General"))].sort((a,b)=>a.localeCompare(b))}
function current(){let a=rows.slice();if(filter==="Favorites")a=a.filter(x=>x.is_favorite);else if(filter!=="All shortcuts")a=a.filter(x=>x.category===filter);if(search){let q=search.toLowerCase();a=a.filter(x=>[x.title,x.url,x.description,x.category].some(v=>String(v||"").toLowerCase().includes(q)))}return a}
function domain(url){try{return new URL(url).hostname.replace(/^www\./,"")}catch{return url}}
function card(x){return '<article class="card"><div class="cardtop"><div class="shortcuticon" style="background:'+(colors.includes(x.accent)?x.accent:colors[0])+'">'+esc(x.icon||"↗")+'</div><div class="cardactions"><button class="iconbtn" data-act="fav" data-id="'+esc(x.id)+'" aria-label="Favorite">'+(x.is_favorite?"★":"☆")+'</button><button class="iconbtn" data-act="edit" data-id="'+esc(x.id)+'" aria-label="Edit">✎</button><button class="iconbtn" data-act="delete" data-id="'+esc(x.id)+'" aria-label="Delete">···</button></div></div><button class="titlebtn" data-act="open" data-id="'+esc(x.id)+'">'+esc(x.title)+'</button><a class="url" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(domain(x.url))+'</a><p class="desc">'+esc(x.description||"A handy link, saved for later.")+'</p><div class="cardfoot"><span class="pill">'+esc(x.category||"General")+'</span><a class="openlink" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Open link ↗</a></div></article>'}
function render(){if(!user)return;let categories=cats(),list=current(),favs=rows.filter(x=>x.is_favorite).length,name=(user.email||"friend").split("@")[0].split(/[._+-]/)[0];app.innerHTML='<div class="shell"><aside class="sidebar"><div class="sidebrand">'+brand()+'</div><nav class="navs"><button class="nav '+(filter==="All shortcuts"?"active":"")+'" data-act="filter" data-filter="All shortcuts"><span class="ni">▦</span><span class="nt">All shortcuts</span><span class="count">'+rows.length+'</span></button><button class="nav '+(filter==="Favorites"?"active":"")+'" data-act="filter" data-filter="Favorites"><span class="ni">☆</span><span class="nt">Favorites</span><span class="count">'+favs+'</span></button></nav><div class="categorysection"><div class="navlabel">Your categories</div><nav class="navs">'+categories.map(c=>'<button class="nav '+(filter===c?"active":"")+'" data-act="filter" data-filter="'+esc(c)+'"><span class="dot"></span><span class="nt">'+esc(c)+'</span><span class="count">'+rows.filter(x=>x.category===c).length+'</span></button>').join("")+'<button class="nav" data-act="add"><span class="ni">＋</span><span class="nt">Add a shortcut</span></button></nav></div><div class="sidebottom"><div class="privacy"><b>✦ Your space, your rules</b><span>Your links are private to your account and synced to your cloud.</span></div><div class="user"><div class="avatar">'+esc((user.email||"H").slice(0,1).toUpperCase())+'</div><div class="umeta"><b>'+esc(user.email||"Signed in")+'</b><small>Personal workspace</small></div><button class="iconbtn" data-act="settings" aria-label="Settings">⚙</button></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace&nbsp; / &nbsp;<b>'+esc(filter)+'</b></div><div class="topright"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search shortcuts…" value="'+esc(search)+'" aria-label="Search shortcuts"></label><button class="btn primary" data-act="add">＋ Add shortcut</button></div></header><div class="content"><section class="greeting"><div><p class="date">Your personal launchpad · '+new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+'</p><h1>'+(new Date().getHours()<12?"Good morning":new Date().getHours()<18?"Good afternoon":"Good evening")+', <span>'+esc(name||"friend")+'</span> ✨</h1><p class="subtitle">A good day starts with the right links close by.</p></div><div class="actions"><button class="btn secondary" data-act="import">↥ Import</button><button class="btn secondary" data-act="export">↧ Export</button></div></section><section class="stats"><div class="stat"><div class="staticon">↗</div><div><small>Total shortcuts</small><b>'+rows.length+'</b></div></div><div class="stat"><div class="staticon">☆</div><div><small>Favorites</small><b>'+favs+'</b></div></div><div class="stat"><div class="staticon">▦</div><div><small>Categories</small><b>'+categories.length+'</b></div></div></section><section><div class="sectionhead"><div><h2>'+esc(filter)+'</h2><p>'+list.length+' shortcut'+(list.length===1?"":"s")+' ready when you are</p></div><div class="viewtoggle"><button class="'+(view==="grid"?"active":"")+'" data-act="view" data-view="grid" aria-label="Grid view">▦</button><button class="'+(view==="list"?"active":"")+'" data-act="view" data-view="list" aria-label="List view">☷</button></div></div>'+(list.length?'<div class="grid '+(view==="list"?"list":"")+'">'+list.map(card).join("")+'</div>':'<div class="empty"><div class="emptyicon">↗</div><h3>'+(search?"No matches just yet":filter==="Favorites"?"No favorites yet":filter!=="All shortcuts"?"No links in this category":"Let’s save your first link")+'</h3><p>'+(search?"Try a different keyword or clear your search.":filter==="Favorites"?"Tap the star on any shortcut to keep it close at hand.":filter!=="All shortcuts"?"Add a shortcut and choose this category.":"Add the sites you use most and make this space your own.")+'</p><button class="btn primary" data-act="'+(search||filter!=="All shortcuts"?"clear":"add")+'">'+(search||filter!=="All shortcuts"?"Show all shortcuts":"＋ Add a shortcut")+'</button></div>')+'</section></div></main></div>';if(document.activeElement && document.activeElement.id==="search"){let el=$("#search");el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
async function refresh(){if(!db||!user)return;const r=await db.from(TABLE).select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:false});if(r.error){rows=[];render();toast("Could not load shortcuts. Run the Supabase schema SQL and check Data API access. "+r.error.message,true);return}rows=r.data||[];if(filter!=="All shortcuts"&&filter!=="Favorites"&&!cats().includes(filter))filter="All shortcuts";render()}
function normalUrl(raw){let s=raw.trim();if(!/^https?:\/\//i.test(s))s="https://"+s;let u;try{u=new URL(s)}catch{throw Error("Enter a valid website URL.")}if(!["http:","https:"].includes(u.protocol))throw Error("Only HTTP and HTTPS links are supported.");return u.href}
function openEditor(item){editId=item?item.id:null;accent=item&&colors.includes(item.accent)?item.accent:colors[0];$("#dialogtitle").textContent=item?"Edit shortcut":"Add a shortcut";$("#dialogsubtitle").textContent=item?"Tidy up the details for this link.":"Save a place you want to find again.";$("#title").value=item?item.title:"";$("#url").value=item?item.url:"";$("#description").value=item?item.description||"":"";$("#category").value=item?item.category||"General":filter!=="Favorites"&&filter!=="All shortcuts"?filter:"General";$("#icon").value=item?item.icon||"↗":"↗";$("#favorite").checked=!!(item&&item.is_favorite);$("#accent").value=accent;$("#formmsg").textContent="";$("#formmsg").classList.remove("show");$("#categoryoptions").innerHTML=cats().map(c=>'<option value="'+esc(c)+'"></option>').join("");$("#swatches").innerHTML=colors.map(c=>'<button type="button" style="background:'+c+'" class="'+(c===accent?"active":"")+'" data-color="'+c+'" aria-label="Select '+c+'"></button>').join("");$("#savebutton").textContent=item?"Save changes":"Add shortcut";dlg.showModal();$("#title").focus()}
async function saveEditor(e){e.preventDefault();let title=$("#title").value.trim(),category=$("#category").value.trim()||"General";if(!title)return msg($("#shortcutform"),"Give this shortcut a name.");if(["all shortcuts","favorites"].includes(category.toLowerCase()))return msg($("#shortcutform"),"Please choose a different category name.");let url;try{url=normalUrl($("#url").value)}catch(err){return msg($("#shortcutform"),err.message)}let payload={title:title.slice(0,80),url,description:$("#description").value.trim().slice(0,280),category:category.slice(0,40),icon:$("#icon").value,accent:$("#accent").value,is_favorite:$("#favorite").checked,updated_at:new Date().toISOString()};let btn=$("#savebutton"),restore=setBusy(btn,true,"Saving…"),was=!!editId;try{let r;if(editId)r=await db.from(TABLE).update(payload).eq("id",editId).eq("user_id",user.id);else{payload.user_id=user.id;r=await db.from(TABLE).insert(payload)}if(r.error)throw r.error;dlg.close();editId=null;toast(was?"Shortcut updated.":"Shortcut saved.");await refresh()}catch(err){msg($("#shortcutform"),"Could not save shortcut: "+err.message)}finally{restore()}}
async function removeItem(id){let x=rows.find(r=>r.id===id);if(!x)return;if(!confirm('Delete "'+x.title+'"? This cannot be undone.'))return;let r=await db.from(TABLE).delete().eq("id",id).eq("user_id",user.id);if(r.error)return toast("Could not delete: "+r.error.message,true);await refresh();toast("Shortcut deleted.")}
async function action(a,id){if(a==="add")return openEditor(null);if(a==="edit")return openEditor(rows.find(x=>x.id===id));if(a==="delete")return removeItem(id);if(a==="fav"){let x=rows.find(z=>z.id===id);if(!x)return;let r=await db.from(TABLE).update({is_favorite:!x.is_favorite,updated_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);if(r.error)return toast(r.error.message,true);await refresh();return toast(x.is_favorite?"Removed from favorites.":"Added to favorites.")}if(a==="open"){let x=rows.find(z=>z.id===id);if(x)window.open(x.url,"_blank","noopener,noreferrer")}if(a==="filter"){filter=id;search="";return render()}if(a==="clear"){filter="All shortcuts";search="";return render()}if(a==="view"){view=id;return render()}if(a==="export")return exportData();if(a==="import")return $("#importfile").click();if(a==="settings"){if(confirm("Sign out of Hoplink? Choose Cancel to keep working."))await signout()}}
async function exportData(){if(!rows.length)return toast("There are no shortcuts to export yet.");let data={app:"Hoplink",version:1,exportedAt:new Date().toISOString(),shortcuts:rows.map(({title,url,description,category,icon,accent,is_favorite})=>({title,url,description,category,icon,accent,is_favorite}))};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="hoplink-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);toast("Backup exported. Keep it somewhere safe.")}
async function importData(file){if(!file)return;if(file.size>5*1024*1024)return toast("Choose a backup under 5 MB.",true);try{let parsed=JSON.parse(await file.text()),source=Array.isArray(parsed)?parsed:parsed.shortcuts;if(!Array.isArray(source)||source.length>500)throw Error("This backup must contain an array of up to 500 shortcuts.");let items=source.map((x,i)=>({user_id:user.id,title:String(x.title||"").trim().slice(0,80),url:normalUrl(String(x.url||"")),description:String(x.description||"").slice(0,280),category:String(x.category||"General").trim().slice(0,40)||"General",icon:String(x.icon||"↗").slice(0,8),accent:colors.includes(x.accent)?x.accent:colors[0],is_favorite:!!x.is_favorite}));if(items.some(x=>!x.title))throw Error("Every shortcut needs a name.");if(!items.length)return toast("There are no shortcuts in this backup.");let r=await db.from(TABLE).insert(items);if(r.error)throw r.error;await refresh();toast("Imported "+items.length+" shortcuts.")}catch(err){toast("Import failed: "+err.message,true)}}
async function signout(){if(db){let r=await db.auth.signOut();if(r.error)toast(r.error.message,true)}}
function setup(){let conf=localStorage.getItem(KEY);try{if(conf){let c=JSON.parse(conf);if(c.url&&c.key){start(c.url,c.key);return}}}catch{}start(PROJECT_URL,PUBLISHABLE_KEY)}
async function start(url,key){if(!window.supabase||!window.supabase.createClient){auth("signin");return toast("Could not load Supabase. Check your internet connection and reload.",true)}db=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});db.auth.onAuthStateChange((event,session)=>{setTimeout(async()=>{user=session&&session.user||null;if(user){await refresh();if(event==="PASSWORD_RECOVERY")newPassword()}else{rows=[];auth("signin")}},0)});let r=await db.auth.getSession();if(r.error){auth("signin");return toast(r.error.message,true)}user=r.data.session&&r.data.session.user||null;if(user)await refresh();else auth("signin")}
function newPassword(){let pw=prompt("Enter your new password (at least 8 characters):");if(!pw)return;if(pw.length<8)return toast("Use at least 8 characters.",true);db.auth.updateUser({password:pw}).then(r=>r.error?toast(r.error.message,true):toast("Password updated."))}
async function submitAuth(form){let mode=form.dataset.mode,email=$("#email").value.trim(),password=$("#password")&&$("#password").value,btn=form.querySelector('button[type="submit"]'),restore=setBusy(btn,true,"Please wait…");try{let r;if(mode==="signin")r=await db.auth.signInWithPassword({email,password});else if(mode==="signup")r=await db.auth.signUp({email,password,options:{emailRedirectTo:location.href.split("#")[0]}});else r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]});restore();if(r.error)return msg(form,r.error.message);if(mode==="signup"&&!r.data.session)return msg(form,"Account created. Check your inbox for the confirmation email, then come back and sign in.");if(mode==="reset")return msg(form,"If an account exists for that email, a password reset link is on its way.");toast(mode==="signup"?"Account created. Welcome to Hoplink!":"Welcome back.")}catch(err){restore();msg(form,err.message||"Something went wrong.")}}
app.addEventListener("click",e=>{let b=e.target.closest("[data-act],[data-mode],#forgot,#changeproject,#close-dialog,#cancel-dialog,[data-color]");if(!b)return;if(b.dataset.mode){auth(b.dataset.mode);return}if(b.id==="forgot"){auth("reset");return}if(b.id==="changeproject"){let url=prompt("Supabase project URL",PROJECT_URL);if(!url)return;let key=prompt("Supabase publishable key (sb_publishable_…)",PUBLISHABLE_KEY);if(!key)return;try{let u=new URL(url);if(!["https:","http:"].includes(u.protocol)||key.includes("service_role")||key.startsWith("sb_secret_"))throw Error("Use a valid project URL and publishable key.");localStorage.setItem(KEY,JSON.stringify({url:u.origin,key:key.trim()}));location.reload()}catch(err){toast(err.message,true)}return}if(b.id==="close-dialog"||b.id==="cancel-dialog"){dlg.close();return}if(b.dataset.color){accent=b.dataset.color;$("#accent").value=accent;$("#swatches").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));return}if(b.dataset.act)action(b.dataset.act,b.dataset.id||b.dataset.filter||b.dataset.view)})
app.addEventListener("submit",e=>{if(e.target.id==="authform"){e.preventDefault();submitAuth(e.target)}});
$("#shortcutform").addEventListener("submit",saveEditor);
app.addEventListener("input",e=>{if(e.target.id==="search"){search=e.target.value;let pos=e.target.selectionStart;render();let next=$("#search");if(next){next.focus();next.setSelectionRange(pos,pos)}}});
$("#importfile").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dlg.open)dlg.close();let typing=e.target.matches("input,textarea,select");if(user&&!typing&&e.key.toLowerCase()==="n"){e.preventDefault();openEditor(null)}if(user&&!typing&&e.key==="/"){e.preventDefault();$("#search")&&$("#search").focus()}});
setup();
})();
</script>
</body>
